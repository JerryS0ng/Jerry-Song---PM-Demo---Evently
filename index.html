<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evently</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* All colors live here so light and dark mode stay in sync.
   Evently (setup site + side panel) uses pine and gold; the calendar app around it stays neutral. */
:root{
  color-scheme:light;
  --bg:#F3EDE2;--surface:#FBF8F1;--surface-2:#ECE5D8;
  --ink:#1E2420;--ink-2:#4D534C;--ink-3:#646860;
  --line:#DFD7C7;--line-strong:#C5BBA7;
  --pine:#00693E;--pine-hover:#00532F;--on-pine:#FFFFFF;--pine-tint:#DDEBE0;
  --gold:#00693E;--gold-strong:#00693E;--on-gold:#FFFFFF;--gold-tint:#E7F0E8;--gold-tint-hl:#D3E6D7;
  --maple:#A8432F;--maple-tint:#F6E1D9;
  --focus:#00693E;--shadow:0 12px 32px rgba(60,45,20,.18);
  --h-bg:#FFFFFF;--h-hover:#EFF1F4;--h-line:#E1E4E8;--h-line-2:#ECEEF1;
  --h-ink:#1E2227;--h-ink-2:#59616B;--h-ink-3:#6B737D;
  --h-accent:#4F56C9;--h-on-accent:#FFFFFF;--h-accent-tint:#E6E7FA;--h-now:#D63A3A;
  --class-fill:#E4E7EB;--class-bar:#66717E;
  --personal-fill:#DCEAF4;--personal-bar:#3A76A1;
  --font-ui:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-host:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --hour:40px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#1A1916;--surface:#23211C;--surface-2:#2D2A24;
    --ink:#EEE8DC;--ink-2:#C5BDAF;--ink-3:#A39B8E;
    --line:#37322B;--line-strong:#4C463D;
    --pine:#4FB07F;--pine-hover:#66C393;--on-pine:#071A10;--pine-tint:#1E3527;
    --gold:#4FB07F;--gold-strong:#4FB07F;--on-gold:#071A10;--gold-tint:#1C3024;--gold-tint-hl:#26402F;
    --maple:#E38B73;--maple-tint:#3C2620;
    --focus:#7FD3A5;--shadow:0 12px 32px rgba(0,0,0,.55);
    --h-bg:#16181B;--h-hover:#24282D;--h-line:#2D3137;--h-line-2:#23272C;
    --h-ink:#E4E7EB;--h-ink-2:#A9B0B8;--h-ink-3:#8E969F;
    --h-accent:#9096F0;--h-on-accent:#121433;--h-accent-tint:#272B4F;--h-now:#F06A6A;
    --class-fill:#262B31;--class-bar:#8F9BA8;
    --personal-fill:#1B2C38;--personal-bar:#6DA6D0;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-ui);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}

/* Prototype bar (not part of the product) */
.proto{position:sticky;top:0;z-index:40;display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.mark{color:var(--pine)}
.proto-tag{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:2px 7px}
.steps{display:flex;flex-wrap:wrap;gap:2px;list-style:none;margin:0;padding:0}
.step-btn{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px}
.step-btn:hover{background:var(--surface-2);color:var(--ink)}
.step-btn .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-size:12.5px;font-weight:700}
.step-btn[aria-current="step"]{background:var(--pine-tint);color:var(--ink)}
.step-btn[aria-current="step"] .num{background:var(--pine);color:var(--on-pine)}
.caption{flex:1 1 260px;margin:0;font-size:13.5px;color:var(--ink-2)}
.restart{margin-left:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface)}
.btn-primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn-primary:hover{background:var(--pine-hover);border-color:var(--pine-hover)}
.btn-primary:disabled:hover{background:var(--pine);border-color:var(--pine)}
.btn-lg{min-height:46px;padding:10px 22px;font-size:16px}
.btn-sm{min-height:34px;padding:5px 12px;font-size:14px}
.link{padding:2px 0;border:0;background:none;color:var(--pine);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.link:hover{text-decoration-thickness:2px}

/* Screen 1: setup website */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start;max-width:1120px;margin:0 auto;padding:48px 24px 72px}
.setup-title{margin:0 0 14px;font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1.02;letter-spacing:-.01em}
.lede{max-width:32em;margin:0 0 36px;font-size:18px;line-height:1.5;color:var(--ink-2)}
.sstep{display:grid;grid-template-columns:32px minmax(0,1fr);gap:0 18px;padding:24px 0 26px;border-top:1px solid var(--line)}
.sstep-num{display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--line-strong);border-radius:50%;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2)}
.sstep.done .sstep-num{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.sstep h2{margin:3px 0 4px;font-size:21px;line-height:1.25;font-weight:700}
.optional{font-weight:500;font-size:15px;color:var(--ink-3)}
.help{max-width:36em;margin:0 0 16px;color:var(--ink-2)}
.connected{display:flex;gap:12px;align-items:flex-start;max-width:34em;padding:12px 16px;border-radius:10px;background:var(--pine-tint)}
.connected svg{flex:none;margin-top:1px;color:var(--pine)}
.connected p{margin:0}
.muted{color:var(--ink-2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-weight:500;font-size:14.5px}
.chip:hover{border-color:var(--pine)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip:disabled:hover{border-color:var(--line-strong)}
.chip .ck{display:none;color:var(--pine)}
.chip[aria-pressed="true"]{background:var(--pine-tint);border-color:var(--pine);font-weight:600}
.chip[aria-pressed="true"] .ck{display:block}
.q-label{display:block;margin:0 0 8px;font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:block;min-width:52px;padding:7px 16px;border-left:1px solid var(--line-strong);background:var(--surface);text-align:center;font-weight:600;font-size:14.5px}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--pine);color:var(--on-pine)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-4px}
.cta{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;padding-top:24px;border-top:1px solid var(--line)}
.cta p{margin:0;font-size:14px;color:var(--ink-3)}

/* The deeper survey: one question at a time */
.survey{max-width:640px;padding:18px 20px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.sv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sv-count{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.sv-bar{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.sv-bar li{width:26px;height:5px;border-radius:3px;background:var(--line)}
.sv-bar li.on{background:var(--pine)}
.sv-q{margin:0 0 4px;font-size:19px;font-weight:700;line-height:1.3}
.sv-hint{max-width:34em;margin:0 0 14px;font-size:14px;color:var(--ink-2)}
.sv-note{margin:10px 0 0;font-size:13.5px;color:var(--ink-3)}
.sv-nav{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.sv-nav .spacer{flex:1}
.sub-q{margin:0 0 16px}
.sub-q:last-child{margin-bottom:0}
.samples{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.sample{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.sample b{display:block;font-size:15px}
.sample small{display:block;font-size:13px;color:var(--ink-2)}
.yn{display:flex;gap:6px}
.yn button{min-height:34px;padding:5px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-weight:600;font-size:13.5px}
.yn button:hover{border-color:var(--pine)}
.yn .yes[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.yn .no[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink-3)}
.sv-done{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;max-width:640px;padding:12px 16px;border-radius:10px;background:var(--pine-tint)}
.sv-done svg{color:var(--pine)}
.sv-done p{margin:0}

/* Live profile card */
.profile{position:sticky;top:calc(var(--proto-h,56px) + 24px);max-height:calc(100vh - var(--proto-h,56px) - 48px);overflow:auto;padding:22px 22px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.profile-title{margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1}
.profile .sub{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
.pgroup{padding:14px 0 12px;border-top:1px solid var(--line)}
.pgroup h3{margin:0 0 8px;font-size:14px;font-weight:700}
.pgroup .empty{margin:0;font-size:14px;color:var(--ink-3)}
.pgroup .pnote{margin:8px 0 0;font-size:13px;color:var(--ink-3)}
.plist{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.pint,.pplain{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;width:100%;padding:6px 8px 6px 4px;border:0;border-radius:8px;background:transparent;text-align:left}
.pint:hover{background:var(--surface-2)}
.blaze{display:block;border-radius:2px;background:var(--gold-strong)}
.pplain .blaze{background:var(--pine)}
.pint b,.pplain b{display:block;font-size:14.5px;font-weight:600}
.pint small,.pplain small{display:block;font-size:12.5px;color:var(--ink-3)}
.pint[aria-pressed="false"] b{color:var(--ink-3);text-decoration:line-through}
.pint[aria-pressed="false"] .blaze{background:var(--line-strong)}
.prows{display:grid;gap:8px;margin:0}
.prows>div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.prows dt{padding-top:1px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.prows dd{margin:0;font-size:14px}
.prows dd.unset{color:var(--ink-3)}

/* Screens 2-4: a calendar app with the Evently side panel */
.cal{display:flex;flex-direction:column;height:calc(100vh - var(--proto-h,56px));height:calc(100dvh - var(--proto-h,56px));background:var(--h-bg);color:var(--h-ink);font-family:var(--font-host);font-size:14px}
.h-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:60px;padding:8px 14px 8px 8px;border-bottom:1px solid var(--h-line)}
.h-icon{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--h-ink-2)}
button.h-icon:hover{background:var(--h-hover);color:var(--h-ink)}
.h-app{display:flex;align-items:center;gap:8px;margin:0 18px 0 2px;font-size:19px;font-weight:500;color:var(--h-ink-2)}
.h-app svg{color:var(--h-accent)}
.h-pill{padding:7px 16px;border:1px solid var(--h-line);border-radius:8px;font-weight:600;font-size:14px}
.h-arrows{display:flex;gap:6px;margin:0 2px;color:var(--h-ink-2)}
.h-range{margin:0 0 0 6px;font-size:20px;font-weight:500;line-height:1.2;white-space:nowrap}
.h-spacer{flex:1}
.h-tools{display:flex;align-items:center;gap:16px;margin-right:12px;color:var(--h-ink-2)}
.h-seg{display:inline-flex;margin-right:12px;border:1px solid var(--h-line);border-radius:8px;overflow:hidden}
.h-seg span{padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--h-ink-2)}
.h-seg span+span{border-left:1px solid var(--h-line)}
.h-seg .on{background:var(--h-accent-tint);color:var(--h-ink)}
.h-avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--h-accent);color:var(--h-on-accent);font-weight:700;font-size:14px}
.h-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 56px}
.h-body.sb{grid-template-columns:224px minmax(0,1fr) 56px}
.h-body.pn{grid-template-columns:minmax(0,1fr) 360px 56px}
.h-body.sb.pn{grid-template-columns:224px minmax(0,1fr) 360px 56px}
.h-side{min-height:0;overflow:auto;padding:14px 12px 20px 14px}
.h-new{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px;padding:9px 16px 9px 12px;border-radius:8px;background:var(--h-accent);color:var(--h-on-accent);font-weight:600}
.mini{margin:0 0 22px}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px 6px;font-weight:600;font-size:14px}
.mini-arrows{display:flex;gap:2px;color:var(--h-ink-2)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center;font-size:12px}
.mini-dow{padding:4px 0;font-size:11px;font-weight:600;color:var(--h-ink-3)}
.mini-d{display:grid;place-items:center;height:26px}
.mini-d.out{color:var(--h-ink-3)}
.mini-d.wk{background:var(--h-hover)}
.mini-d.wk-s{border-radius:13px 0 0 13px}
.mini-d.wk-e{border-radius:0 13px 13px 0}
.mini-d.today span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--h-accent);color:var(--h-on-accent);font-weight:700}
.h-sh{margin:0 0 6px 6px;font-size:14px;font-weight:600}
.h-cals{margin:0;padding:0;list-style:none}
.h-cals label{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer}
.h-cals label:hover{background:var(--h-hover)}
.h-cals input{width:16px;height:16px;margin:0;cursor:pointer}
.h-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.grid-wrap{flex:1;min-height:0;overflow:auto}
.ghead{position:sticky;top:0;z-index:6;min-width:616px;border-bottom:1px solid var(--h-line);background:var(--h-bg)}
.grow,.grid-body{display:grid;grid-template-columns:56px repeat(7,minmax(80px,1fr));min-width:616px}
.tz,.ad-gut{position:sticky;left:0;z-index:2;background:var(--h-bg)}
.tz{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 4px 0;font-size:11px;color:var(--h-ink-3)}
.dh{display:flex;align-items:center;gap:6px;padding:8px 8px 6px 10px;font-size:13px;font-weight:600;color:var(--h-ink-2)}
.dn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:500;color:var(--h-ink)}
.dh.today{color:var(--h-accent)}
.dh.today .dn{background:var(--h-accent);color:var(--h-on-accent)}
.ad-cell{min-width:0;min-height:28px;padding:2px 3px 4px;border-left:1px solid var(--h-line)}
.ad-chip{display:block;overflow:hidden;padding:2px 8px;border-radius:5px;background:var(--personal-fill);box-shadow:inset 3px 0 0 var(--personal-bar);font-size:12px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.grid-body{position:relative;height:calc(var(--hour) * 16 + 10px)}
.gutter{position:sticky;left:0;z-index:4;background:var(--h-bg)}
.gutter span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--h-ink-3);white-space:nowrap}
.gutter span.first{transform:none}
.col{position:relative;border-left:1px solid var(--h-line);background-image:repeating-linear-gradient(to bottom,var(--h-line-2) 0,var(--h-line-2) 1px,transparent 1px,transparent var(--hour))}
.now{position:absolute;left:0;right:0;z-index:3;height:2px;background:var(--h-now);pointer-events:none}
.now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--h-now)}
.blk{position:absolute;margin:0;padding:3px 6px 3px 9px;border:0;border-radius:6px;overflow:hidden;background:none;color:var(--h-ink);text-align:left;font-size:12px;line-height:1.25}
.blk .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.blk .m{display:block;overflow:hidden;font-size:11.5px;color:var(--h-ink-2);white-space:nowrap;text-overflow:ellipsis}
.blk.short .t{-webkit-line-clamp:1}
.blk.class{background:var(--class-fill);box-shadow:inset 3px 0 0 var(--class-bar)}
.blk.personal{background:var(--personal-fill);box-shadow:inset 3px 0 0 var(--personal-bar)}
/* Suggestions are drawn by Evently, so they use Evently's typeface and colors. */
.blk.pick,.blk.conflict{padding-left:7px;border:1.5px dashed var(--gold);background:var(--gold-tint);color:var(--ink);font-family:var(--font-ui);cursor:pointer}
.blk.pick .m,.blk.conflict .m{color:var(--ink-2)}
.blk.conflict{border-color:var(--maple);background:var(--maple-tint)}
.blk.pick:hover,.blk.pick.hl{background:var(--gold-tint-hl)}
.blk.sel{z-index:2;border-style:solid;border-width:2px}
.blk.added{background:var(--pine);color:var(--on-pine);cursor:pointer}
.blk.added .m{color:var(--on-pine);opacity:.88}
.blk.added:hover,.blk.added.hl{background:var(--pine-hover)}
.blk.added.sel{z-index:2;box-shadow:0 0 0 2px var(--h-bg),0 0 0 4px var(--pine)}
.blk .tiny{display:inline-block;margin-right:3px;vertical-align:-1px}
/* The one big moment: a dashed suggestion gets painted solid, like a trail blaze. */
.blk.just::after{content:"";position:absolute;inset:0;border:1.5px dashed var(--gold);border-radius:inherit;background:var(--gold-tint);animation:unpaint .8s cubic-bezier(.55,0,.25,1) .05s forwards}
@keyframes unpaint{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
.blk.enter{animation:drop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 80ms + 120ms)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;border-left:1px solid var(--h-line);background:var(--h-bg)}
button.rail-btn{position:relative;width:42px;height:42px;color:var(--pine)}
button.rail-btn:hover{background:var(--h-hover);color:var(--pine)}
button.rail-btn[aria-pressed="true"]{background:var(--pine-tint)}
.rail-sep{width:24px;height:1px;background:var(--h-line)}
.rail-add{display:grid;place-items:center;width:42px;height:42px;color:var(--h-ink-3)}
.count{position:absolute;top:0;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold-strong);color:var(--on-gold);font-size:11.5px;font-weight:700;line-height:18px;text-align:center}

/* Side panel (the extension) */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--h-line);background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px}
.phead{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.pname{font-weight:700;font-size:16px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.phead .icon-btn{margin-left:auto}
.pbody{display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;padding:22px 18px 0}
.ptitle{margin:0 0 8px;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05}
.psub{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
.picks{margin:0;padding:0;list-style:none}
.picks li{border-top:1px solid var(--line)}
.pi{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;width:100%;padding:14px 10px 14px 6px;border:0;border-radius:8px;background:transparent;color:var(--ink);text-align:left}
.pi:hover,.pi.hl{background:var(--surface)}
.pi-body>span{display:block}
.when{font-size:13px;font-weight:600;color:var(--ink-2)}
.pi .title{margin:2px 0;font-size:16.5px;font-weight:700;line-height:1.25}
.where{font-size:13.5px;color:var(--ink-2)}
.why{margin-top:6px;font-size:13.5px}
.pi-body>.state{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:700;color:var(--pine)}
.pi-body>.state.warn{color:var(--maple)}
.subhead{margin:22px 0 4px;font-size:15px;font-weight:700}
.note{margin:16px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.pfoot{margin-top:auto;padding:22px 0 18px;font-size:12.5px;color:var(--ink-3)}
.pfoot p{margin:0 0 6px}
.back{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;margin:-8px 0 12px -10px;padding:6px 10px 6px 4px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px}
.back:hover{background:var(--surface-2);color:var(--ink)}
.dmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.dtitle{margin:0 0 14px;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1}
.facts{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px 10px;align-items:start;margin:0 0 16px;font-size:14.5px}
.facts svg{margin-top:2px;color:var(--ink-3)}
.desc{margin:0 0 18px;font-size:15px;line-height:1.55}
.why-box{margin:0 0 16px;padding:14px 16px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.why-box h3,.sorted h3{margin:0 0 6px;font-size:15px;font-weight:700}
.rows{margin:0}
.rows>div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:6px 0}
.why-box .rows>div+div{border-top:1px solid var(--line)}
.rows dt{padding-top:1px;font-size:13px;font-weight:600;color:var(--ink-3)}
.rows dd{margin:0;font-size:14px}
.rows dd span{display:block}
.rows dd span+span{margin-top:4px}
.rows dd span.warn{color:var(--maple);font-weight:600}
.sorted{margin:0 0 18px}
.tag{display:inline-block;margin:0 4px 4px 0;padding:1px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12.5px}
.also{margin:0 0 16px;padding:12px 14px;border:1.5px dashed var(--gold);border-radius:12px;background:var(--gold-tint)}
.also p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2)}
.also-btn{display:block;width:100%;padding:0;border:0;background:transparent;color:var(--ink);text-align:left}
.also-btn .t{display:block;font-weight:700;font-size:15px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.also-btn .m{display:block;font-size:13px;color:var(--ink-2)}
.dactions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:auto -18px 0;padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--bg)}
.added-msg{display:flex;align-items:center;gap:6px;margin-right:auto;font-weight:700;color:var(--pine)}
.toast{position:fixed;left:50%;bottom:24px;z-index:60;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 10px 10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:14.5px;transform:translateX(-50%)}
.toast button{padding:6px 10px;border:0;border-radius:6px;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.toast button:focus-visible{outline-color:var(--bg)}
.toast.show{animation:toast .22s ease-out both}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:1000px){
  .setup{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:32px}
  .profile{position:static;max-height:none}
  .cal{height:auto}
  .h-body,.h-body.sb,.h-body.pn,.h-body.sb.pn{display:flex;flex-direction:column}
  .h-side,.h-top [data-action="sidebar"],.h-tools,.h-seg{display:none}
  .h-main{order:1;height:70vh}
  .rail{order:2;flex-direction:row;padding:8px 12px;border-left:0;border-top:1px solid var(--h-line)}
  .panel{order:3;border-left:0}
  .pbody{overflow:visible}
}
@media (max-width:640px){
  .setup{padding:24px 16px 56px}
  .setup-title{font-size:36px}
  .sstep{grid-template-columns:28px minmax(0,1fr);gap:0 12px}
  .sstep-num{width:28px;height:28px;font-size:13px}
  .survey{padding:16px 14px 12px}
  .step-btn{padding:4px}
  .step-btn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  .caption{order:3;flex-basis:100%}
  .h-app span{display:none}
  .h-app{margin-right:6px}
  .h-range{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .blk.just::after{display:none}
}

/* ===== v4: tabs, working calendar controls, month view, priority ===== */
:root{--h-out:#F7F8FA}
@media (prefers-color-scheme:dark){:root{--h-out:#1A1C20}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.tab-btn{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px}
.tab-btn:hover{background:var(--surface-2);color:var(--ink)}
.tab-btn svg{color:var(--ink-3)}
.tab-btn[aria-current="page"]{background:var(--pine-tint);color:var(--ink)}
.tab-btn[aria-current="page"] svg{color:var(--pine)}
button.h-pill{background:transparent;color:inherit;cursor:pointer}
button.h-pill:hover{background:var(--h-hover)}
.h-arrows button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--h-ink-2)}
.h-arrows button:hover:not(:disabled){background:var(--h-hover);color:var(--h-ink)}
.h-arrows button:disabled{opacity:.35;cursor:not-allowed}
.h-seg>*+*{border-left:1px solid var(--h-line)}
.h-seg button{padding:6px 12px;border:0;background:transparent;font-size:13.5px;font-weight:600;color:var(--h-ink-2)}
.h-seg button:hover{background:var(--h-hover);color:var(--h-ink)}
.h-seg button[aria-pressed="true"]{background:var(--h-accent-tint);color:var(--h-ink)}
.h-seg .inert{color:var(--h-ink-3)}
.h-switch{display:inline-flex;align-items:center;gap:8px;margin-right:12px;padding:5px 12px 5px 6px;border:1px solid var(--h-line);border-radius:999px;background:transparent;color:var(--h-ink);font-size:13.5px;font-weight:600}
.h-switch:hover{background:var(--h-hover)}
.sw-track{position:relative;display:block;width:30px;height:18px;border-radius:9px;background:var(--h-line);transition:background .15s}
.sw-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.h-switch[aria-checked="true"] .sw-track{background:var(--gold-strong)}
.h-switch[aria-checked="true"] .sw-knob{transform:translateX(12px)}
button.mini-d{width:100%;padding:0;border:0;background:transparent;color:inherit;font-size:12px;cursor:pointer}
.mini-d span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%}
button.mini-d:hover span{background:var(--h-line)}
button.mini-d.today:hover span{background:var(--h-accent)}
.dh.past,.dh.past .dn{color:var(--h-ink-3)}
button.ad-chip{width:100%;border:0;text-align:left;font-size:12px;font-weight:600;cursor:pointer}
.ad-chip+.ad-chip{margin-top:2px}
.ad-chip.pick{border:1.5px dashed var(--gold);background:var(--gold-tint);box-shadow:none;color:var(--ink);font-family:var(--font-ui)}
.ad-chip.pick:hover,.ad-chip.pick.hl{background:var(--gold-tint-hl)}
.ad-chip.added{background:var(--pine);box-shadow:none;color:var(--on-pine)}
.ad-chip.sel,.m-chip.sel{outline:2px solid var(--pine);outline-offset:1px}
/* Month view */
.month{display:flex;flex-direction:column;min-width:640px;min-height:100%}
.m-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--h-line);background:var(--h-bg)}
.m-head span{padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--h-ink-2)}
.m-grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(112px,1fr)}
.m-cell{min-width:0;overflow:hidden;padding:4px 4px 6px;border-right:1px solid var(--h-line);border-bottom:1px solid var(--h-line)}
.m-cell:nth-child(7n){border-right:0}
.m-cell.out{background:var(--h-out)}
.m-date{display:grid;place-items:center;min-width:26px;height:26px;margin:0 0 2px 2px;padding:0 6px;border:0;border-radius:13px;background:transparent;font-size:12.5px;font-weight:600;color:var(--h-ink)}
.m-date:hover{background:var(--h-hover)}
.m-cell.past .m-date,.m-cell.out .m-date{color:var(--h-ink-3)}
.m-cell.today .m-date{background:var(--h-accent);color:var(--h-on-accent)}
.m-list{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:0;padding:0;list-style:none}
.m-list li{min-width:0}
.m-chip{display:block;width:100%;overflow:hidden;padding:1px 6px;border:0;border-radius:4px;background:transparent;color:var(--h-ink);font-size:11.5px;line-height:1.5;text-align:left;white-space:nowrap;text-overflow:ellipsis}
.m-t{margin-right:4px;color:var(--h-ink-2)}
.m-chip.class{background:var(--class-fill)}
.m-chip.personal,.m-chip.allday{background:var(--personal-fill)}
.m-chip.allday{font-weight:600}
.m-chip.pick{border:1px dashed var(--gold);background:var(--gold-tint);color:var(--ink);font-family:var(--font-ui);font-weight:600;cursor:pointer}
.m-chip.pick .m-t{color:var(--ink-2)}
.m-chip.pick:hover,.m-chip.pick.hl{background:var(--gold-tint-hl)}
.m-chip.added{background:var(--pine);color:var(--on-pine);font-weight:600;cursor:pointer}
.m-chip.added .m-t{color:var(--on-pine);opacity:.85}
.m-chip.added:hover,.m-chip.added.hl{background:var(--pine-hover)}
.m-more{padding:1px 6px;border:0;background:transparent;color:var(--h-ink-2);font-size:11.5px;font-weight:600;text-align:left}
.m-more:hover{color:var(--h-ink);text-decoration:underline}
.area-h{margin:22px 0 4px;font-size:16px;font-weight:700}

/* ===== v5: Evently ===== */
body{font-size:16px;font-optical-sizing:auto}
.proto{gap:8px 18px;padding:10px 20px;background:var(--bg)}
.brand{gap:9px;font-family:var(--font-display);font-weight:600;font-size:21px;color:var(--pine);letter-spacing:-.01em}
.tab-btn{font-size:15px}
.btn{border-radius:10px}
/* Welcome */
.welcome{max-width:640px;margin:0 auto;padding:13vh 24px 80px}
.wordmark{display:flex;align-items:center;gap:10px;margin:0 0 44px;font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--pine)}
.w-title{margin:0 0 18px;font-family:var(--font-display);font-weight:600;font-size:54px;line-height:1.03;letter-spacing:-.02em}
.w-lede{max-width:30em;margin:0 0 34px;font-size:19px;line-height:1.5;color:var(--ink-2)}
.w-cta{min-width:300px;border-radius:999px}
.w-fine{margin:14px 0 0;font-size:14.5px;color:var(--ink-3)}
.w-connected{display:flex;gap:12px;align-items:flex-start;max-width:470px;margin:0 0 24px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.w-connected svg{flex:none;margin-top:3px;color:var(--pine)}
.w-connected b{display:block;font-weight:600}
.w-connected small{display:block;margin-top:2px;font-size:14.5px;color:var(--ink-2)}
/* One question per screen */
.ob{display:flex;flex-direction:column;max-width:640px;min-height:calc(100vh - var(--proto-h,56px));margin:0 auto;padding:0 24px}
.ob-head{position:sticky;top:var(--proto-h,56px);z-index:5;display:flex;align-items:center;gap:16px;padding:18px 0 12px;background:var(--bg)}
.ob-icon{display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;border:0;border-radius:50%;background:transparent;color:var(--ink)}
.ob-icon:hover{background:var(--surface-2)}
.ob-progress{flex:1;height:4px;overflow:hidden;border-radius:2px;background:var(--line)}
.ob-progress span{display:block;height:100%;border-radius:2px;background:var(--pine);transition:width .3s ease}
.ob-skip{padding:8px 2px;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:16px}
.ob-skip:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ob-back{display:inline-flex;align-items:center;gap:4px;margin-left:-8px;padding:8px 12px 8px 4px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:600;font-size:16px}
.ob-back:hover{background:var(--surface-2);color:var(--ink)}
.ob-body{flex:1;padding:30px 0 28px}
.ob-q{margin:0 0 10px;font-family:var(--font-display);font-weight:600;font-size:42px;line-height:1.06;letter-spacing:-.018em}
.ob-hint{margin:0 0 28px;font-size:17.5px;line-height:1.45;color:var(--ink-2)}
.ob-count{margin:18px 0 0;font-size:14.5px;color:var(--ink-3)}
.ob-foot{position:sticky;bottom:0;display:flex;gap:12px;padding:20px 0 26px;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 28%)}
.ob-foot .btn{flex:1;border-radius:999px}
.ob-finish{background:transparent}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{min-height:46px;padding:10px 19px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);font-size:16.5px}
.pill:hover{border-color:var(--pine)}
.pill[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left}
.opt:hover{border-color:var(--line-strong)}
.opt[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-tint)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt-text{flex:1;min-width:0}
.opt-text b{display:block;font-size:18px;font-weight:600}
.opt-text small{display:block;margin-top:2px;font-size:15px;color:var(--ink-2)}
.opt-box{display:grid;place-items:center;flex:none;width:28px;height:28px;border:1.5px solid var(--line-strong);border-radius:50%;color:transparent}
.opt[aria-pressed="true"] .opt-box{border-color:var(--pine);background:var(--pine);color:var(--on-pine)}
.sgroup{margin-top:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.opts+.sgroup{margin-top:28px}
.srow{display:flex;align-items:center;gap:16px;margin:0;padding:18px 18px}
.srow+.srow{border-top:1px solid var(--line)}
.srow.col{display:block}
.srow-text{flex:1}
.srow b{display:block;font-size:18px;font-weight:600}
.srow small{display:block;margin-top:2px;font-size:15px;color:var(--ink-2)}
.srow legend{float:left;width:100%;margin:0 0 12px}
.srow-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.srow-val{font-size:16.5px;font-weight:600;color:var(--pine)}
.rng{width:100%;height:28px;margin:0;accent-color:var(--pine);cursor:pointer}
.seg2{clear:both;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg2 label{position:relative;display:block}
.seg2 input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg2 span{display:block;padding:11px 8px;border:1.5px solid var(--line-strong);border-radius:12px;text-align:center;font-size:16px}
.seg2 input:checked+span{border-color:var(--pine);background:var(--pine);color:var(--on-pine)}
.seg2 input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.tgl{position:relative;flex:none;width:52px;height:32px;border:0;border-radius:16px;background:var(--line-strong);transition:background .15s}
.tgl-knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tgl[aria-checked="true"]{background:var(--pine)}
.tgl[aria-checked="true"] .tgl-knob{transform:translateX(20px)}
/* "Would you go?" cards */
.stack{display:flex;flex-direction:column;align-items:center}
.ecard{width:100%;max-width:460px;min-height:236px;padding:28px 28px 26px;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:0 16px 36px rgba(60,45,20,.13);animation:cardin .3s ease-out both}
@keyframes cardin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.ecard-when{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--pine)}
.ecard-title{margin:0 0 12px;font-family:var(--font-display);font-weight:600;font-size:31px;line-height:1.1;letter-spacing:-.01em}
.ecard-blurb{margin:0;font-size:17.5px;line-height:1.5;color:var(--ink-2)}
.ecard-actions{display:flex;gap:32px;margin-top:26px}
.round{display:grid;place-items:center;width:66px;height:66px;border:1.5px solid var(--line-strong);border-radius:50%;background:var(--surface);box-shadow:0 6px 16px rgba(60,45,20,.12);transition:transform .12s}
.round svg{width:26px;height:26px}
.round.no{color:var(--maple)}
.round.yes{color:var(--pine)}
.round:hover{transform:translateY(-2px)}
.ecard-labels{display:flex;gap:32px;margin-top:8px;font-size:14px;color:var(--ink-3)}
.ecard-labels span{width:66px;text-align:center}
.dots{display:flex;justify-content:center;gap:8px;margin-top:24px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dots .cur{background:var(--ink-2)}
.dots .y{background:var(--pine)}
.dots .n{background:var(--maple)}
.card-done{max-width:460px;margin:0 auto;padding:30px 28px;border:1.5px dashed var(--line-strong);border-radius:24px;text-align:center}
.cd-big{margin:0 0 6px;font-family:var(--font-display);font-size:27px;font-weight:600}
.card-done .muted{margin:0 0 14px}
/* Preferences */
.prefs{max-width:680px;margin:0 auto;padding:52px 24px 80px}
.prefs-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:18px;margin-bottom:30px}
.prefs-title{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:42px;line-height:1.05;letter-spacing:-.018em}
.prefs-sub{margin:0;font-size:17.5px;color:var(--ink-2)}
.prefs-head .btn{border-radius:999px}
.pgrp{margin:0 0 26px}
.pgrp h2{margin:0 0 8px 4px;font-size:15px;font-weight:600;color:var(--ink-3)}
.pgrp-list{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surface)}

.pi{grid-template-columns:minmax(0,1fr);padding:14px 10px}
.pi .title{font-weight:600;font-size:17.5px}
.ptitle{font-weight:600;font-size:29px;letter-spacing:-.012em}
.dtitle{font-weight:600;letter-spacing:-.01em}
.dmatch{margin:0 0 6px;font-size:14.5px;font-weight:600;color:var(--pine)}
.dmatch.warn{color:var(--maple)}
.dsec{margin:0 0 20px}
.dsec h3{margin:0 0 10px;font-size:16.5px;font-weight:600}
.reasons{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.reasons li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;font-size:15.5px;line-height:1.4}
.reasons svg{margin-top:2px;color:var(--pine)}
.reasons .warn{color:var(--maple)}
.reasons .warn svg{color:var(--maple)}
.reasons .time svg{color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags .tag{margin:0;padding:3px 11px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:14px}
.tags .added-tag{border-style:dashed}
.tags .area-tag{border-color:transparent;background:var(--pine-tint);color:var(--pine)}
.tag-note{margin:8px 0 0;font-size:13.5px;color:var(--ink-3)}
.dsource{margin:0 0 18px;font-size:14.5px;color:var(--ink-3)}

}

.prio:hover{border-color:var(--maple)}

.prio::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);z-index:5;padding:5px 9px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;letter-spacing:0;white-space:nowrap;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .12s}

/* ===== Profile + matching =====
   Score = 4 per category chosen (organizer tags plus ones Evently adds from keywords) + 4 per academic area chosen + 3 per survey topic
         + 2 per interest found on the calendar + 2 per goal the event serves (up to 2)
         + 1 per tag shared with past, added, or "I'd go" events + 1 if it's at a time they like + 1 if the crowd size fits.
   Minus: 1 per tag shared with "Not for me" examples, 1 for the wrong crowd size,
          3 if it runs longer than they can spare. Off-campus events are dropped for "Stay on campus",
          past events are skipped, and events that overlap the calendar are held back. */
function profile() {
  const interests = state.connected ? CAL_INTERESTS.filter(ci => !state.intOff.has(ci.interest)) : [];
  const history = [];
  if (state.connected) PAST.forEach(p => history.push(Object.assign({kind:'past', id:null}, p)));
  SAMPLES.forEach(s => {
    if (state.rated[s.id] === 'yes') history.push({kind:'sample', id:null, title:s.short, short:s.short, interests:s.interests, categories:s.categories});
  });
  state.added.forEach(id => {
    const e = EV[id];
    history.push({kind:'added', id:id, title:e.short, short:e.short, interests:e.interests, categories:e.allCats});
  });
  const avoid = new Set();
  SAMPLES.forEach(s => { if (state.rated[s.id] === 'no') s.categories.concat(s.interests).forEach(t => avoid.add(t)); });
  return {cats:state.cats, areas:state.areas, times:state.times, interests:interests, history:history, goals:state.goals, topics:state.topics,
    crowd:state.crowd || 'any', spare:state.spare || 9999, trips:state.trips || 'yes', avoid:avoid};
}
function analyze(e, p) {
  const survey = e.allCats.filter(c => p.cats.has(c));
  const areas = e.areas.filter(x => p.areas.has(x));
  const topics = e.interests.filter(i => p.topics.has(i));
  const calendar = p.interests.filter(ci => e.interests.includes(ci.interest));
  const goals = GOALS.filter(g => p.goals.has(g.id) && e.goals.includes(g.id));
  const keys = new Set(), hist = [];
  p.history.forEach(h => {
    if (h.id === e.id) return;
    const viaI = h.interests.filter(i => e.interests.includes(i));
    const viaC = h.categories.filter(c => e.allCats.includes(c));
    if (viaI.length || viaC.length) {
      hist.push({h:h, viaI:viaI, viaC:viaC});
      viaI.concat(viaC).forEach(k => keys.add(k));
    }
  });
  const avoided = e.allCats.concat(e.interests).filter(t => p.avoid.has(t));
  const bucket = timeBucket(e), timeOk = p.times.has(bucket);
  const mins = e.allDay ? 1440 : e.end - e.start, tooLong = mins > p.spare;
  const off = e.allCats.includes('Off Campus Event'), offBad = off && p.trips === 'no';
  const crowdFit = p.crowd === 'any' ? 0 : (p.crowd === e.vibe ? 1 : -1);
  const score = survey.length * 4 + areas.length * 4 + topics.length * 3 + calendar.length * 2 + Math.min(goals.length, 2) * 2 +
    keys.size + (timeOk ? 1 : 0) + crowdFit - avoided.length - (tooLong ? 3 : 0) - (offBad ? 6 : 0);
  const richness = [survey.length + areas.length, topics.length, calendar.length, goals.length, keys.size, timeOk ? 1 : 0].filter(Boolean).length;
  return {survey, areas, topics, calendar, goals, hist, avoided, score, richness, bucket, timeOk, mins, tooLong, off, offBad, crowdFit};
}
function rankWith(p) {
  const cache = new Map();
  const A = e => { if (!cache.has(e.id)) cache.set(e.id, analyze(e, p)); return cache.get(e.id); };
  return (x, y) => (A(y).score - A(x).score) || (A(y).richness - A(x).richness) || (when(x) - when(y));
}
function busyOn(day, exceptId) {
  const list = BASE_BUSY.filter(b => b.day === day);
  state.added.forEach(id => {
    if (id === exceptId) return;
    const a = EV[id];
    if (a.day === day && !a.allDay) list.push({kind:'added', title:a.short, ref:a.short, day:a.day, start:a.start, end:a.end});
  });
  return list;
}
const conflictOf = e => (e.allDay ? [] : busyOn(e.day, e.id).filter(b => overlaps(b, e)));
const baseConflictOf = e => (e.allDay ? [] : BASE_BUSY.filter(b => b.day === e.day && overlaps(b, e)));

    if (state.added.has(e.id) || state.dismissed.has(e.id) || conflictOf(e).length) return false;
    const a = analyze(e, p);

}

// Keep each week varied: a pick already chosen for the same category, topic, interest, goal,
// or day counts against the next one, so one strong theme or one busy evening can't take every slot.
function pickVaried(sorted, p, n) {
  const chosen = [], used = {}, rest = sorted.slice();
  const bump = k => { used[k] = (used[k] || 0) + 1; };
  const u = k => used[k] || 0;
  while (chosen.length < n && rest.length) {
    let bi = 0, bs = -Infinity;
    rest.forEach((e, i) => {
      const a = analyze(e, p);
      const s = a.score - a.survey.reduce((t, c) => t + u('c:' + c) * 2, 0) - a.areas.reduce((t, x) => t + u('a:' + x) * 2, 0) - a.topics.reduce((t, x) => t + u('t:' + x) * 2, 0) -
        a.calendar.reduce((t, ci) => t + u('i:' + ci.interest) * 2, 0) - a.goals.reduce((t, g) => t + u('g:' + g.id), 0) - u('d:' + e.day) * 1.5;
      if (s > bs) { bs = s; bi = i; }

    a.survey.forEach(c => bump('c:' + c)); a.areas.forEach(x => bump('a:' + x)); a.topics.forEach(x => bump('t:' + x));
    a.calendar.forEach(ci => bump('i:' + ci.interest)); a.goals.forEach(g => bump('g:' + g.id)); bump('d:' + e.day);

function buildList() {

    const we = Math.min(ws + 6, LAST_DAY);
    const pinned = EVENTS.filter(e => state.added.has(e.id) && e.day >= ws && e.day <= we).map(e => e.id);
    const slots = Math.max(0, (state.perWeek || 5) - pinned.length);
    state.shown = state.shown.concat(pinned, pickVaried(pool(p, ws, we).sort(rankWith(p)), p, slots).map(e => e.id));

}

    if (e.day < from || e.day > to || isPast(e)) return false;
    if (vis.has(e.id) || state.added.has(e.id) || state.dismissed.has(e.id) || !baseConflictOf(e).length) return false;
    const a = analyze(e, p);

function scheduleFit(e) {
  if (e.allDay) return {text:(e.endDay > e.day ? 'It runs for ' + (e.endDay - e.day + 1) + ' days' : 'It runs all day') + ", so you can stop by whenever you're free."};
  const list = busyOn(e.day, e.id);
  const hit = list.filter(b => overlaps(b, e));
  if (hit.length) return {conflict:true, text:'Overlaps ' + hit[0].ref + ' (' + fmtRange(hit[0].start, hit[0].end) + ').'};
  const before = list.filter(b => b.end <= e.start).sort((a, b) => b.end - a.end)[0];
  const after = list.filter(b => b.start >= e.end).sort((a, b) => a.start - b.start)[0];
  if (before && after) return {text:'Fits between ' + before.ref + ' and ' + after.ref + '.'};
  if (before) return {text:"You're free after " + before.ref + ' ends at ' + fmtTime(before.end) + '.'};

function histLine(m) {

  a.calendar.forEach(ci => { if (ps.length < 2) { ps.push(ci.verb); covered.add(ci.interest); } });
  if (a.goals.length && ps.length < 2) ps.push(a.goals[0].short);

  if (a.topics.length) out.push({k:'ok', t:"You're curious about " + listJoin(a.topics.map(t => LOWER[t])) + '.'});
  if (a.goals.length) out.push({k:'ok', t:'You want to ' + listJoin(a.goals.map(g => g.why)) + '.'});

  if (state.spare) parts.push({60:'up to 1 hour', 120:'up to 2 hours', 9999:'half a day or more'}[state.spare]);
  if (state.trips) parts.push(state.trips === 'yes' ? 'trips are fine' : 'on campus only');

  return (t.length ? listJoin(t) : 'Any time') + (state.perWeek ? ', ' + state.perWeek + ' picks a week.' : '.');

  const no = SAMPLES.filter(s => state.rated[s.id] === 'no').map(s => s.short);
  if (yes.length && no.length) return "You'd go to " + listJoin(yes) + ', but not ' + listJoin(no, 'or') + '.';
  if (yes.length) return "You'd go to " + listJoin(yes) + '.';
  if (no.length) return "You'd skip " + listJoin(no) + '.';

function layoutDay(items) {
  items.sort((a, b) => a.start - b.start || b.end - a.end);
  let cluster = [], end = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => {
      let c = cols.findIndex(colEnd => it.start >= colEnd);
      if (c === -1) { c = cols.length; cols.push(it.end); } else cols[c] = it.end;
      it.col = c;
    });
    cluster.forEach(it => { it.ncol = cols.length; });
    cluster = []; end = -1;
  };
  items.forEach(it => { if (cluster.length && it.start >= end) flush(); cluster.push(it); end = Math.max(end, it.end); });
  if (cluster.length) flush();
}
// Evently's items for a date range: events on the Evently calendar, plus suggestions when the switch is on.
function cairnItems(p, from, to, withConflicts) {
  const out = [], seen = new Set();
  const push = (id, kind) => { if (!seen.has(id) && EV[id].day <= to && EV[id].endDay >= from) { seen.add(id); out.push({id:id, kind:kind}); } };
  if (state.layers.cairn) state.added.forEach(id => push(id, 'added'));
  if (state.showPicks) {
    state.shown.forEach(id => { if (!state.added.has(id)) push(id, 'pick'); });
    state.fromHistory.forEach(f => { if (!state.added.has(f.id)) push(f.id, 'pick'); });
    if (withConflicts && state.showConflicts) hiddenConflicts(p, from, to).forEach(e => push(e.id, 'conflict'));
  }

  showToast("Marked not interested. You'll see fewer like this.", () => {
    state.dismissed.delete(id);
    if (filled) state.shown = state.shown.filter(x => x !== filled);
    if (wasShown) state.shown.push(id);
    if (histEntry) state.fromHistory.unshift(histEntry);
    hideToast(); render();
  });
}
function goTab(tab, toPrefs) {
  hideToast();
  if (tab === 'website') {
    state.tab = 'website';
    if (!state.connected) state.site = 'welcome';
    else if (toPrefs || (state.svDone && state.site === 'welcome')) { state.site = state.svDone ? 'prefs' : 'survey'; state.editing = null; }
    state.focusKey = toPrefs ? (state.site === 'prefs' ? 'prefs-title' : 'obq') : 'tab:website';
    render(); window.scrollTo(0, 0); return;
  }
  enterCalendar(); state.focusKey = 'tab:calendar'; render(); window.scrollTo(0, 0);
}
function finishSurvey() {
  state.svDone = true; state.site = 'prefs'; state.editing = null; state.focusKey = 'prefs-title';
  render(); window.scrollTo(0, 0);
}
function toQuestion(i) { state.svPage = i; state.focusKey = 'obq'; render(); window.scrollTo(0, 0); }
function restart() {
  hideToast();
  state = freshState();
  savedListScroll = 0; pendingPanelScroll = null; lastPanelKey = '';
  state.focusKey = 'setup-title';
  render(); window.scrollTo(0, 0);
}

/* ===== Toast ===== */
function showToast(msg, undo) {
  const t = $('#toast');
  toastUndo = undo || null;
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" data-action="undo">Undo</button>' : '');
  t.hidden = false; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
}
function hideToast() { const t = $('#toast'); t.hidden = true; toastUndo = null; clearTimeout(toastTimer); }

/* ===== Events ===== */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-action]');
  if (!t || t.disabled) return;
  const v = t.dataset.val, id = t.dataset.id;
  switch (t.dataset.action) {
    case 'tab': goTab(t.dataset.tab); break;
    case 'restart': restart(); break;
    case 'connect': connect(); break;
    case 'start': state.site = 'survey'; state.editing = null; toQuestion(0); break;
    case 'cat': toggle(state.cats, v); render(); break;
    case 'area': toggle(state.areas, v); render(); break;
    case 'topic': toggle(state.topics, v); render(); break;
    case 'time': toggle(state.times, v); render(); break;
    case 'int': toggle(state.intOff, v); render(); break;
    case 'goal': if (state.goals.has(v)) state.goals.delete(v); else if (state.goals.size < 3) state.goals.add(v); render(); break;
    case 'campus': state.trips = state.trips === 'no' ? null : 'no'; render(); break;
    case 'rate': state.rated[id] = v; state.sampleIdx++; state.focusKey = state.sampleIdx < SAMPLES.length ? 'ecard' : 'rate-reset'; render(); break;
    case 'rate-reset': state.rated = {}; state.sampleIdx = 0; state.focusKey = 'ecard'; render(); break;
    case 'sv-next':
    case 'sv-skip': if (state.svPage >= FLOW.length - 1) finishSurvey(); else toQuestion(state.svPage + 1); break;
    case 'sv-back':
      if (state.svPage > 0) toQuestion(state.svPage - 1);
      else { state.site = 'welcome'; state.focusKey = 'w-title'; render(); window.scrollTo(0, 0); }
      break;
    case 'sv-finish': finishSurvey(); break;
    case 'edit-q': state.editing = +t.dataset.q; state.site = 'survey'; state.focusKey = 'obq'; render(); window.scrollTo(0, 0); break;
    case 'edit-close': state.editing = null; state.site = 'prefs'; state.focusKey = 'prefs-title'; render(); window.scrollTo(0, 0); break;
    case 'see': if (state.connected) { enterCalendar(); state.focusKey = 'ptitle'; render(); window.scrollTo(0, 0); } break;
    case 'open': openEvent(id); break;
    case 'back': back(); break;
    case 'add': addEvent(id, false); break;
    case 'priority': togglePriority(id); break;
    case 'remove': removeEvent(id, false); break;
    case 'dismiss': dismissEvent(id); break;
    case 'close-panel': state.panelOpen = false; state.focusKey = 'rail'; render(); break;
    case 'toggle-panel':
      state.panelOpen = !state.panelOpen;
      state.focusKey = state.panelOpen ? (state.panel === 'detail' && state.selected ? 'dtitle' : 'ptitle') : 'rail';
      render(); break;
    case 'toggle-picks': state.showPicks = !state.showPicks; state.focusKey = t.dataset.key === 'show-picks' ? 'toggle-picks' : t.dataset.key; render(); break;
    case 'sidebar': state.sidebar = !state.sidebar; state.focusKey = 'sidebar'; render(); break;
    case 'today': state.weekStart = weekOf(TODAY); state.focusKey = t.dataset.key === 'back-today' ? 'ptitle' : 'today'; render(); break;
    case 'prev': state.weekStart = Math.max(weekOf(FIRST_DAY), state.weekStart - 7); if (state.panel === 'detail') { state.panel = 'list'; state.selected = null; } render(); break;
    case 'next': state.weekStart = Math.min(weekOf(LAST_DAY), state.weekStart + 7); if (state.panel === 'detail') { state.panel = 'list'; state.selected = null; } render(); break;
    case 'view': state.view = t.dataset.view; state.focusKey = 'view:' + state.view; render(); break;
    case 'goto-day':
      state.view = 'week'; state.weekStart = weekOf(+t.dataset.day);
      if (state.panel === 'detail' && state.selected && weekOf(EV[state.selected].day) !== state.weekStart) { state.panel = 'list'; state.selected = null; }
      state.focusKey = 'view:week'; render(); break;
    case 'edit': goTab('website', true); break;
    case 'conflicts': state.showConflicts = !state.showConflicts; state.focusKey = 'conflicts'; render(); break;
    case 'undo': if (toastUndo) { const u = toastUndo; toastUndo = null; u(); } break;
  }
});
// Sliders update their label as they move, without re-rendering the page mid-drag.
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.type !== 'range') return;
  let txt;
  if (t.name === 'spare') { const val = SPARE_STEPS[+t.value]; state.spare = val; txt = SPARE_LABEL[val]; }
  else if (t.name === 'per') { state.perWeek = +t.value; txt = t.value + (t.value === '1' ? ' pick' : ' picks'); }
  else return;
  const out = document.getElementById('val-' + t.name);
  if (out) out.textContent = txt;
  t.setAttribute('aria-valuetext', txt);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.layer) { state.layers[t.dataset.layer] = t.checked; state.focusKey = 'layer:' + t.dataset.layer; render(); return; }
  if (t.dataset.picks) { state.showPicks = t.checked; state.focusKey = 'layer:picks'; render(); return; }
  if (t.name === 'crowd') { state.crowd = t.value; state.focusKey = 'crowd:' + t.value; render(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && state.tab === 'calendar' && state.panelOpen && state.panel === 'detail') back();
});
// Hovering a pick in the list highlights it on the calendar, and the other way around.
const HL = '.blk[data-id], .pi[data-id], .m-chip[data-id], .ad-chip[data-id]';
function setHL(target, on) {
  const id = target.dataset.id;
  document.querySelectorAll(HL).forEach(n => { if (n.dataset.id === id) n.classList.toggle('hl', on); });
}
['mouseover', 'focusin'].forEach(type => document.addEventListener(type, ev => {
  const t = ev.target.closest && ev.target.closest(HL);
  if (t && !(ev.relatedTarget && t.contains(ev.relatedTarget))) setHL(t, true);
}));
['mouseout', 'focusout'].forEach(type => document.addEventListener(type, ev => {
  const t = ev.target.closest && ev.target.closest(HL);
  if (t && !(ev.relatedTarget && t.contains(ev.relatedTarget))) setHL(t, false);
}));

/* ===== Init ===== */
document.querySelectorAll('[data-app-name]').forEach(n => { n.textContent = APP; });
const proto = $('#proto');
const setH = () => document.documentElement.style.setProperty('--proto-h', proto.offsetHeight + 'px');
if (window.ResizeObserver) new ResizeObserver(setH).observe(proto);
setH();
render();
})();
</script>
</body>
